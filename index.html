        <h2 style="font-size:22px;color:#00363a;">🔒 Privacy Policy</h2>
        <p><em>Last updated: April 10, 2026</em></p>

        <h3>1. Introduction</h3>
        <p>Welcome to <strong>Teamworks Nexus</strong> (hereinafter referred to as <strong>"T-Nexus"</strong>, <strong>"we"</strong>, <strong>"us"</strong>). We are committed to protecting your privacy and personal data. This policy explains how we collect, use, store, and protect personal information when you use the T-Nexus platform.</p>
        <p>By accessing and using T-Nexus, you agree to the terms of this Privacy Policy.</p>

        <h3>2. Information We Collect</h3>
        <h4>2.1 Information You Provide Directly</h4>
        <ul>
          <li><strong>Account information:</strong> Full name, email, student ID, phone number, username.</li>
          <li><strong>Profile information:</strong> Avatar, bio, skills, institution, major, social media links.</li>
          <li><strong>User-generated content:</strong> Submissions, comments, feedback, task notes, attachments.</li>
        </ul>
        <h4>2.2 Information Collected Automatically</h4>
        <ul>
          <li><strong>Usage data:</strong> Pages you visit, time spent, actions within the system.</li>
          <li><strong>Device information:</strong> Browser, operating system, IP address, device type.</li>
          <li><strong>Cookies and similar technologies:</strong> To maintain login sessions and improve user experience.</li>
        </ul>
        <h4>2.3 Information from Third Parties</h4>
        <ul>
          <li><strong>Google Sign-In:</strong> When you use Google to sign in, we receive your name, email, and profile picture from your Google account.</li>
        </ul>

        <h3>3. How We Use Your Information</h3>
        <ul>
          <li><strong>Providing services:</strong> Creating and managing accounts, processing submissions, managing group projects.</li>
          <li><strong>Communication:</strong> Sending system notifications, deadline reminders, admin responses.</li>
          <li><strong>Improving services:</strong> Analyzing usage to enhance the experience and features.</li>
          <li><strong>Security:</strong> Detecting and preventing unauthorized access and system abuse.</li>
          <li><strong>Payments:</strong> Processing service plan upgrade transactions (if applicable).</li>
        </ul>

        <h3>4. Sharing and Disclosure</h3>
        <p>We <strong>do not sell</strong> your personal information to third parties. We only share information in the following cases:</p>
        <ul>
          <li><strong>Project team members:</strong> Your name, avatar, and task status are visible to members in the same project.</li>
          <li><strong>System administrators:</strong> Administrators have access to necessary information to manage the system.</li>
          <li><strong>Public profiles:</strong> If you enable a public profile, some information (name, bio, achievements) will be visible to everyone.</li>
          <li><strong>Legal requirements:</strong> When required by competent authorities under applicable law.</li>
        </ul>

        <h3>5. Data Storage and Security</h3>
        <ul>
          <li>Data is stored on secure cloud infrastructure and encrypted at rest.</li>
          <li>Data encryption in transit (HTTPS/TLS).</li>
          <li>Secure password authentication with hashing.</li>
          <li>Role-Based Access Control (RBAC) and Row-Level Security (RLS) policies.</li>
          <li>After account deletion, personal data will be removed within 30 days.</li>
        </ul>

        <h3>6. Your Rights</h3>
        <ul>
          <li><strong>Right of access:</strong> View personal information we store about you.</li>
          <li><strong>Right to rectification:</strong> Update or correct personal information.</li>
          <li><strong>Right to erasure:</strong> Request deletion of your account and personal data.</li>
          <li><strong>Right to data portability:</strong> Request export of personal data in a readable format.</li>
        </ul>

        <h3>7. Children's Privacy</h3>
        <p>T-Nexus does not knowingly collect information from children under 16.</p>

        <h3>8. Policy Changes</h3>
        <p>We may update this Privacy Policy from time to time. Changes will be communicated via system notifications and email.</p>
